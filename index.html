<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 — AI Win Predictor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-primary: #080c18;
    --bg-secondary: #0f1729;
    --bg-card: rgba(255,255,255,0.03);
    --bg-card-hover: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.07);
    --text-primary: #eef2f6;
    --text-secondary: #8899b0;
    --text-muted: #5a6a80;
    --accent-blue: #3b82f6;
    --accent-green: #10b981;
    --accent-amber: #f59e0b;
    --accent-red: #ef4444;
    --accent-purple: #8b5cf6;
    --shadow: 0 8px 40px rgba(0,0,0,0.5);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 800px 500px at 10% 30%, rgba(59,130,246,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 600px 600px at 80% 20%, rgba(245,158,11,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 500px 500px at 50% 80%, rgba(16,185,129,0.04) 0%, transparent 60%);
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

  /* ─── Header ─────────────────────────────────────────────────── */
  header {
    padding: 24px 0 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,12,24,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    box-shadow: 0 4px 24px rgba(245,158,11,0.25);
  }
  .logo-text h1 {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #eef2f6, #8899b0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    line-height: 1.2;
  }
  .logo-text span {
    font-size: 11px; color: var(--text-muted);
    font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase;
  }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .live-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(16,185,129,0.1);
    color: var(--accent-green);
  }
  .live-badge::before {
    content: ''; width: 7px; height: 7px;
    background: var(--accent-green); border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.7); } }
  .last-updated { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  /* ─── Tabs ────────────────────────────────────────────────────── */
  .tabs {
    display: flex; gap: 2px; padding: 16px 0 12px;
    flex-wrap: wrap;
    position: sticky; top: 84px; z-index: 99;
    background: rgba(8,12,24,0.7);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .tab-btn {
    padding: 8px 18px; border: none;
    background: transparent; color: var(--text-muted);
    font-family: inherit; font-size: 13px; font-weight: 500;
    border-radius: 8px; cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 5px;
  }
  .tab-btn:hover { color: var(--text-primary); background: var(--bg-card); }
  .tab-btn.active {
    background: rgba(59,130,246,0.12);
    color: #60a5fa; font-weight: 600;
  }
  .tab-count {
    font-size: 10px; font-weight: 600;
    background: var(--bg-card); padding: 1px 7px;
    border-radius: 20px; color: var(--text-muted);
  }
  .tab-btn.active .tab-count { background: rgba(59,130,246,0.2); color: #60a5fa; }

  /* ─── Section ─────────────────────────────────────────────────── */
  .section-title {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-muted);
    margin: 20px 0 12px;
    display: flex; align-items: center; gap: 8px;
  }

  /* ─── Match Grid ──────────────────────────────────────────────── */
  .matches-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }

  /* ─── Match Card ──────────────────────────────────────────────── */
  .match-card {
    background: var(--bg-card);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .match-card:hover {
    background: var(--bg-card-hover);
    border-color: rgba(255,255,255,0.1);
    transform: translateY(-1px);
  }
  .match-card.live {
    border-color: rgba(16,185,129,0.25);
    background: rgba(16,185,129,0.03);
  }
  .match-card.live::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent-green), var(--accent-blue), var(--accent-green));
    background-size: 200% 100%;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer { 0%,100% { background-position: 0 0; } 50% { background-position: 100% 0; } }

  .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .match-group {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-muted);
    background: rgba(255,255,255,0.04); padding: 3px 10px; border-radius: 6px;
  }
  .match-status {
    font-size: 10px; font-weight: 600;
    padding: 3px 10px; border-radius: 6px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .match-status.finished { background: rgba(100,116,139,0.12); color: var(--text-secondary); }
  .match-status.live {
    background: rgba(16,185,129,0.12); color: var(--accent-green);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .match-status.upcoming { background: rgba(59,130,246,0.08); color: #60a5fa; }

  .match-teams { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; margin-bottom: 14px; }
  .team { display: flex; flex-direction: column; gap: 4px; }
  .team.home { align-items: flex-start; }
  .team.away { align-items: flex-end; }
  .team-flag { font-size: 32px; line-height: 1; }
  .team-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .team.home .team-name { text-align: left; }
  .team.away .team-name { text-align: right; }
  .team-rank { font-size: 10px; color: var(--text-muted); font-weight: 500; }

  .score { font-size: 28px; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 3px; }
  .score-colon { color: var(--text-muted); }
  .score-home { color: var(--accent-blue); }
  .score-away { color: var(--accent-red); }
  .score-vs { color: var(--text-muted); font-weight: 500; font-size: 16px; }

  .match-info { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-muted); margin-bottom: 12px; }
  .match-info span { display: flex; align-items: center; gap: 4px; }

  /* ─── AI Prediction ───────────────────────────────────────────── */
  .prediction-section { position: relative; }
  .ai-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-amber);
    background: rgba(245,158,11,0.08);
    padding: 2px 8px; border-radius: 4px;
    margin-bottom: 4px;
  }
  .prediction-labels {
    display: flex; justify-content: space-between;
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.3px; margin-bottom: 3px;
  }
  .prediction-labels .p-home { color: var(--accent-blue); }
  .prediction-labels .p-away { color: var(--accent-red); }
  .prediction-labels .p-draw { color: var(--accent-purple); }

  .prediction-bar {
    height: 5px; border-radius: 10px;
    background: var(--bg-secondary);
    display: flex; overflow: hidden;
  }
  .prediction-bar .seg-home { background: var(--accent-blue); transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
  .prediction-bar .seg-draw { background: var(--accent-purple); transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }
  .prediction-bar .seg-away { background: var(--accent-red); transition: width 1.2s cubic-bezier(0.4,0,0.2,1); }

  .prediction-probs {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 700; margin-top: 3px;
  }
  .prediction-probs .pp-home { color: var(--accent-blue); }
  .prediction-probs .pp-draw { color: var(--accent-purple); }
  .prediction-probs .pp-away { color: var(--accent-red); }

  .prediction-hint {
    font-size: 10px; color: var(--text-muted);
    text-align: center; margin-top: 4px;
    font-style: italic;
  }

  /* ─── Groups Grid ─────────────────────────────────────────────── */
  .groups-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .group-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .group-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .standings-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .standings-table th {
    font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.5px; color: var(--text-muted);
    padding: 5px 3px; text-align: left; border-bottom: 1px solid var(--border);
  }
  .standings-table th:last-child { text-align: center; }
  .standings-table td { padding: 6px 3px; border-bottom: 1px solid rgba(255,255,255,0.02); color: var(--text-secondary); }
  .standings-table .pos { width: 20px; font-weight: 600; color: var(--text-muted); font-size: 11px; }
  .standings-table .team-cell { display: flex; align-items: center; gap: 6px; }
  .standings-table .team-flag-sm { font-size: 16px; }
  .standings-table .team-name-sm { font-weight: 500; }
  .standings-table .stat { text-align: center; font-size: 11px; }
  .standings-table .pts { font-weight: 700; color: var(--text-primary); }
  .standings-table tr.top-two td .team-name-sm { color: var(--text-primary); }
  .standings-table tr.top-two td .pts { color: var(--accent-green); }

  /* ─── States ──────────────────────────────────────────────────── */
  .loading-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent-amber);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 50px 20px; color: var(--text-muted); }
  .empty-state .icon { font-size: 42px; margin-bottom: 10px; }

  /* ─── Footer ──────────────────────────────────────────────────── */
  footer { text-align: center; padding: 36px 0; color: var(--text-muted); font-size: 11px; border-top: 1px solid var(--border); margin-top: 40px; }
  footer a { color: #60a5fa; text-decoration: none; }

  /* ─── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .container { padding: 0 14px; }
    .matches-grid { grid-template-columns: 1fr; }
    .groups-grid { grid-template-columns: 1fr; }
    .logo-icon { width: 36px; height: 36px; font-size: 20px; }
    .logo-text h1 { font-size: 16px; }
    .tab-btn { padding: 6px 12px; font-size: 12px; }
    .match-team-flag { font-size: 26px; }
    .score { font-size: 24px; }
    .tabs { top: 72px; }
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<div class="bg-glow"></div>

<header>
  <div class="container header-inner">
    <a href="#" class="logo">
      <div class="logo-icon">⚽</div>
      <div class="logo-text">
        <h1>World Cup 2026</h1>
        <span>AI win predictor</span>
      </div>
    </a>
    <div class="header-right">
      <div class="live-badge" id="liveIndicator">Live</div>
      <div class="last-updated" id="lastUpdated">—</div>
    </div>
  </div>
</header>

<main class="container">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="all"><span>📊</span> All</button>
    <button class="tab-btn" data-tab="live"><span>🔴</span> Live <span class="tab-count" id="countLive">0</span></button>
    <button class="tab-btn" data-tab="upcoming"><span>📅</span> Upcoming <span class="tab-count" id="countUpcoming">0</span></button>
    <button class="tab-btn" data-tab="finished"><span>✅</span> Finished <span class="tab-count" id="countFinished">0</span></button>
    <button class="tab-btn" data-tab="standings"><span>🏆</span> Standings</button>
  </div>

  <div id="content">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading FIFA World Cup data...</p>
    </div>
  </div>
</main>

<footer>
  <div class="container">
    <p>Data via <a href="https://wheniskickoff.com" target="_blank">wheniskickoff.com</a> — FIFA World Cup 2026 🇺🇸🇲🇽🇨🇦</p>
  </div>
</footer>

<script>
const API_BASE = 'https://wheniskickoff.com/data/v1';
const REFRESH_MS = 30000;

let matchesData = [], teamsData = [], groupsData = [];
let currentTab = 'all';

// ─── Helpers ───────────────────────────────────────────────────────
function getDt(m) {
  const s = m.datetime_utc.endsWith('Z') ? m.datetime_utc : m.datetime_utc + 'Z';
  return new Date(s);
}

function classify(m) {
  if (m.status === 'FINISHED') return 'finished';
  const dt = getDt(m);
  const now = new Date();
  const diffH = (now - dt) / 3600000;
  if (m.status === '?' || !m.status) {
    if (diffH < 3 && diffH > -0.5) return 'live';
  }
  if (dt < now) return 'finished';
  return 'upcoming';
}

// ─── Data ──────────────────────────────────────────────────────────
async function loadData() {
  const [mr, tr, gr] = await Promise.all([
    fetch(`${API_BASE}/matches.json`),
    fetch(`${API_BASE}/teams.json`),
    fetch(`${API_BASE}/groups.json`),
  ]);
  const m = await mr.json(), t = await tr.json(), g = await gr.json();
  matchesData = m.data || []; teamsData = t.data || []; groupsData = g.data || [];
}

// ─── AI Prediction ─────────────────────────────────────────────────
function predict(home, away, phase) {
  const ht = teamsData.find(x => x.code === home);
  const at = teamsData.find(x => x.code === away);
  const rH = ht?.rank ?? 50, rA = at?.rank ?? 50;

  let eH = 1 / (1 + Math.pow(10, (rA - rH) / 400));
  let eA = 1 - eH;

  if (phase !== 'group') {
    if (rH < rA) eH += 0.06; else eA += 0.06;
  }

  const fH = form(home, 3), fA = form(away, 3);
  eH += (fH - fA) * 0.04; eA -= (fH - fA) * 0.04;

  const draw = Math.max(0.08, Math.min(0.30, 0.22 - Math.abs(eH - eA) * 0.3));
  const tot = eH + eA;
  return {
    home: Math.round((eH / tot) * (1 - draw) * 100),
    draw: Math.round(draw * 100),
    away: Math.round((eA / tot) * (1 - draw) * 100),
    winner: eH > eA ? 'home' : (eA > eH ? 'away' : 'draw'),
  };
}

function form(code, n) {
  const played = matchesData
    .filter(m => (m.home === code || m.away === code) && m.status === 'FINISHED' && m.score_home != null)
    .slice(-n);
  if (!played.length) return 0.5;
  let pts = 0;
  for (const m of played) {
    const gd = m.home === code ? m.score_home - m.score_away : m.score_away - m.score_home;
    if (gd > 0) pts += 1; else if (gd === 0) pts += 0.5;
  }
  return pts / played.length;
}

// ─── Standings ─────────────────────────────────────────────────────
function standings() {
  const s = {};
  for (const g of groupsData) {
    s[g.group] = {};
    for (const c of g.teams) {
      if (c === 'URY') continue;
      s[g.group][c] = { code: c, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
    }
  }
  for (const m of matchesData) {
    if (m.status !== 'FINISHED' || m.score_home == null || m.phase !== 'group') continue;
    if (!s[m.group] || !s[m.group][m.home] || !s[m.group][m.away]) continue;
    const h = s[m.group][m.home], a = s[m.group][m.away];
    h.p++; a.p++; h.gf += m.score_home; h.ga += m.score_away;
    a.gf += m.score_away; a.ga += m.score_home;
    if (m.score_home > m.score_away) { h.w++; a.l++; h.pts += 3; }
    else if (m.score_home < m.score_away) { a.w++; h.l++; a.pts += 3; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
    h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;
  }
  for (const g in s) s[g] = Object.values(s[g]).sort((a, b) =>
    b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.code.localeCompare(b.code)
  );
  return s;
}

// ─── Render ────────────────────────────────────────────────────────
function cardHTML(m) {
  const cat = m._cat || classify(m);
  const live = cat === 'live', finished = cat === 'finished', upcoming = !live && !finished;

  const ht = teamsData.find(x => x.code === m.home);
  const at = teamsData.find(x => x.code === m.away);

  const score = finished
    ? `<span class="score-home">${m.score_home}</span><span class="score-colon">:</span><span class="score-away">${m.score_away}</span>`
    : live
    ? `<span class="score-home">${m.score_home ?? '?'}</span><span class="score-colon">:</span><span class="score-away">${m.score_away ?? '?'}</span>`
    : `<span class="score-vs">vs</span>`;

  const stCls = finished ? 'finished' : live ? 'live' : 'upcoming';
  const stLbl = finished ? 'FT' : live ? 'LIVE' : 'UPCOMING';

  const pred = predict(m.home, m.away, m.phase);
  const winner = pred.winner === 'home' ? m.home_name : (pred.winner === 'away' ? m.away_name : 'Draw');

  let time;
  if (finished) {
    const d = getDt(m);
    time = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  } else if (upcoming) {
    const d = getDt(m); const n = new Date(); const df = d - n;
    if (df > 0 && df < 86400000) {
      time = `${Math.floor(df / 3600000)}h ${Math.floor((df % 3600000) / 60000)}m`;
    } else {
      time = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }
  } else {
    time = getDt(m).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
  }

  return `
    <div class="match-card${live ? ' live' : ''}">
      <div class="match-header">
        <span class="match-group">${m.phase === 'group' ? 'Group ' + m.group : m.phase.replace(/_/g, ' ')}</span>
        <span class="match-status ${stCls}">${stLbl}</span>
      </div>
      <div class="match-teams">
        <div class="team home">
          <span class="team-flag">${ht?.flag ?? '🏳️'}</span>
          <span class="team-name">${m.home_name}</span>
          <span class="team-rank">FIFA #${ht?.rank ?? '—'}</span>
        </div>
        <div class="score">${score}</div>
        <div class="team away">
          <span class="team-flag">${at?.flag ?? '🏳️'}</span>
          <span class="team-name">${m.away_name}</span>
          <span class="team-rank">FIFA #${at?.rank ?? '—'}</span>
        </div>
      </div>
      <div class="match-info">
        <span>${upcoming ? '⏳' : ''} ${time}</span>
        <span>${m.venue_name ?? ''}</span>
      </div>
      <div class="prediction-section">
        <div class="ai-badge">🤖 AI Predict</div>
        <div class="prediction-labels">
          <span class="p-home">${m.home_name}</span>
          <span class="p-draw">Draw</span>
          <span class="p-away">${m.away_name}</span>
        </div>
        <div class="prediction-bar">
          <div class="seg-home" style="width:${pred.home}%"></div>
          <div class="seg-draw" style="width:${pred.draw}%"></div>
          <div class="seg-away" style="width:${pred.away}%"></div>
        </div>
        <div class="prediction-probs">
          <span class="pp-home">${pred.home}%</span>
          <span class="pp-draw">${pred.draw}%</span>
          <span class="pp-away">${pred.away}%</span>
        </div>
        <div class="prediction-hint">AI predicts <strong>${winner}</strong> wins</div>
      </div>
    </div>`;
}

function renderTab(cat) {
  const all = matchesData.map(m => ({ ...m, _cat: classify(m) }));
  let list;
  if (cat === 'live') list = all.filter(m => m._cat === 'live');
  else if (cat === 'upcoming') list = all.filter(m => m._cat === 'upcoming');
  else if (cat === 'finished') list = all.filter(m => m._cat === 'finished');
  else list = all;

  if (cat === 'live' && !list.length) list = all.filter(m => m._cat === 'upcoming').slice(0, 6);
  return list.map(cardHTML).join('');
}

function renderStandings() {
  const sg = standings();
  return groupsData.map(g => {
    const rows = sg[g.group];
    if (!rows || !rows.length) return '';
    return `
      <div class="group-card">
        <div class="group-title">🏆 Group ${g.group}</div>
        <table class="standings-table">
          <thead><tr>
            <th></th><th>Team</th><th class="stat">P</th><th class="stat">W</th>
            <th class="stat">D</th><th class="stat">L</th><th class="stat">GD</th><th class="stat">Pts</th>
          </tr></thead>
          <tbody>${rows.map((t, i) => {
            const team = teamsData.find(x => x.code === t.code);
            return `<tr class="${i < 2 ? 'top-two' : ''}">
              <td class="pos">${i + 1}</td>
              <td><div class="team-cell"><span class="team-flag-sm">${team?.flag ?? '🏳️'}</span><span class="team-name-sm">${team?.name ?? t.code}</span></div></td>
              <td class="stat">${t.p}</td><td class="stat">${t.w}</td><td class="stat">${t.d}</td>
              <td class="stat">${t.l}</td><td class="stat">${t.gd > 0 ? '+' : ''}${t.gd}</td>
              <td class="stat pts">${t.pts}</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`;
  }).join('');
}

function refresh() {
  const all = matchesData.map(m => ({ ...m, _cat: classify(m) }));
  document.getElementById('countLive').textContent = all.filter(m => m._cat === 'live').length;
  document.getElementById('countUpcoming').textContent = all.filter(m => m._cat === 'upcoming').length;
  document.getElementById('countFinished').textContent = all.filter(m => m._cat === 'finished').length;
  document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

  const ct = document.getElementById('content');

  if (currentTab === 'standings') {
    ct.innerHTML = '<div class="section-title">🏆 Group Standings</div><div class="groups-grid">' + renderStandings() + '</div>';
    return;
  }

  if (currentTab === 'all') {
    const l = all.filter(m => m._cat === 'live');
    const u = all.filter(m => m._cat === 'upcoming');
    const f = all.filter(m => m._cat === 'finished');
    ct.innerHTML = (l.length
      ? '<div class="section-title">🔴 Live Now</div><div class="matches-grid">' + l.map(cardHTML).join('') + '</div>'
      : '') +
      '<div class="section-title">📅 Upcoming</div><div class="matches-grid">' + u.map(cardHTML).join('') + '</div>' +
      '<div class="section-title">✅ Recent Results</div><div class="matches-grid">' + f.slice(0, 12).map(cardHTML).join('') + '</div>';
    return;
  }

  const html = renderTab(currentTab);
  if (!html) {
    ct.innerHTML = '<div class="empty-state"><div class="icon">⚽</div><p>' +
      (currentTab === 'live' ? 'No live matches right now.' :
       currentTab === 'upcoming' ? 'No upcoming matches.' : 'No finished matches yet.') + '</p></div>';
    return;
  }
  ct.innerHTML = '<div class="matches-grid">' + html + '</div>';
}

// ─── Boot ──────────────────────────────────────────────────────────
async function boot() {
  try {
    await loadData();
    refresh();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load match data.</p><p style="font-size:12px;color:var(--text-muted);margin-top:6px;">' + e.message + '</p></div>';
  }
}

// ─── Tab switching ─────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  currentTab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  refresh();
});

// ─── Start ─────────────────────────────────────────────────────────
boot();
setInterval(boot, REFRESH_MS);
</script>

</body>
</html>
