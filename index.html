<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="FIFA World Cup 2026 — Live scores, AI match predictions, and group standings. Free, fast, beautiful.">
<meta name="theme-color" content="#080c18">
<meta property="og:title" content="FIFA World Cup 2026 — AI Win Predictor">
<meta property="og:description" content="Live scores, AI match predictions, and group standings for the 2026 World Cup.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://world-cup-2026-ai.vercel.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="FIFA World Cup 2026 — AI Win Predictor">
<meta name="twitter:description" content="Live scores, AI predictions, and group standings.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
<link rel="manifest" href="/manifest.json">
<title>FIFA World Cup 2026 — AI Win Predictor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#060a14;
    --bg-card:rgba(255,255,255,0.025);
    --bg-card-hover:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.06);
    --text:#eef2f6;
    --text-sec:#8899b0;
    --text-muted:#4d5b6e;
    --blue:#3b82f6;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
    --purple:#8b5cf6;
    --radius:14px;
    --font:'Inter',-apple-system,system-ui,sans-serif
  }
  body{
    font-family:var(--font);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale
  }
  ::selection{background:rgba(59,130,246,.25);color:#fff}

  .bg-glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(ellipse 900px 600px at 5% 25%,rgba(59,130,246,.05) 0%,transparent 70%),
      radial-gradient(ellipse 700px 700px at 80% 15%,rgba(245,158,11,.035) 0%,transparent 60%),
      radial-gradient(ellipse 600px 600px at 50% 85%,rgba(16,185,129,.035) 0%,transparent 60%)
  }
  .container{max-width:1120px;margin:0 auto;padding:0 20px;position:relative;z-index:1}

  header{
    padding:20px 0 12px;
    border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:100;
    background:rgba(6,10,20,.88);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px)
  }
  .header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;flex-shrink:0}
  .logo-icon{
    width:40px;height:40px;
    background:linear-gradient(135deg,#f59e0b,#ef4444);
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-size:22px
  }
  .logo-text h1{
    font-size:18px;font-weight:800;line-height:1.15;
    background:linear-gradient(180deg,#f1f5f9,#94a3b8);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent
  }
  .logo-text span{font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:1.2px;text-transform:uppercase}
  .header-right{display:flex;align-items:center;gap:14px}
  .live-badge{
    display:flex;align-items:center;gap:5px;
    font-size:11px;font-weight:600;
    padding:5px 12px;border-radius:20px;
    background:rgba(16,185,129,.08);color:var(--green);
    white-space:nowrap
  }
  .live-badge::before{
    content:'';width:6px;height:6px;
    background:var(--green);border-radius:50%;
    animation:pulse 1.4s ease-in-out infinite
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.65)}}
  .updated{font-size:10px;color:var(--text-muted);white-space:nowrap;font-feature-settings:"tnum"}

  .tabs{
    display:flex;gap:2px;padding:12px 0 8px;
    flex-wrap:nowrap;overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;-ms-overflow-style:none
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab-btn{
    padding:7px 14px;border:none;
    background:0 0;color:var(--text-muted);
    font-family:var(--font);font-size:12px;font-weight:500;
    border-radius:8px;cursor:pointer;
    transition:all .2s;flex-shrink:0;
    display:flex;align-items:center;gap:4px
  }
  .tab-btn:hover{color:var(--text);background:var(--bg-card)}
  .tab-btn.active{background:rgba(59,130,246,.12);color:#60a5fa;font-weight:600}
  .tab-count{
    font-size:9px;font-weight:600;
    background:var(--bg-card);padding:1px 6px;
    border-radius:20px;color:var(--text-muted)
  }
  .tab-btn.active .tab-count{background:rgba(59,130,246,.18);color:#60a5fa}

  .section-title{
    font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:1.2px;color:var(--text-muted);
    margin:16px 0 10px;display:flex;align-items:center;gap:6px
  }

  .matches-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}

  .match-card{
    background:var(--bg-card);
    backdrop-filter:blur(8px);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    transition:all .25s;
    position:relative;overflow:hidden;
    cursor:default
  }
  .match-card:hover{background:var(--bg-card-hover);border-color:rgba(255,255,255,.09);transform:translateY(-1px)}
  .match-card.live{border-color:rgba(16,185,129,.2);background:rgba(16,185,129,.025)}
  .match-card.live::after{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--green),var(--blue),var(--green));
    background-size:200% 100%;animation:shimmer 3s ease-in-out infinite
  }
  @keyframes shimmer{0%,100%{background-position:0 0}50%{background-position:100% 0}}

  .match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .match-group{
    font-size:9px;font-weight:600;text-transform:uppercase;
    letter-spacing:.8px;color:var(--text-muted);
    background:rgba(255,255,255,.03);padding:2px 8px;border-radius:5px
  }
  .match-status{
    font-size:9px;font-weight:600;
    padding:2px 8px;border-radius:5px;
    text-transform:uppercase;letter-spacing:.4px
  }
  .match-status.finished{background:rgba(100,116,139,.1);color:var(--text-sec)}
  .match-status.live{background:rgba(16,185,129,.1);color:var(--green)}
  .match-status.upcoming{background:rgba(59,130,246,.07);color:#60a5fa}

  .match-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:12px}
  .team{display:flex;flex-direction:column;gap:3px}
  .team.home{align-items:flex-start}
  .team.away{align-items:flex-end}
  .team-flag{font-size:30px;line-height:1}
  .team-name{font-size:13px;font-weight:600;color:var(--text)}
  .team.home .team-name{text-align:left}
  .team.away .team-name{text-align:right}
  .team-rank{font-size:9px;color:var(--text-muted);font-weight:500}
  .score{font-size:26px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:2px}
  .score-colon{color:var(--text-muted)}
  .score-home{color:var(--blue)}
  .score-away{color:var(--red)}
  .score-vs{color:var(--text-muted);font-weight:500;font-size:14px}

  .match-info{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-bottom:10px}
  .match-info span{display:flex;align-items:center;gap:3px}

  .ai-badge{
    display:inline-flex;align-items:center;gap:3px;
    font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
    color:var(--amber);background:rgba(245,158,11,.07);
    padding:1px 7px;border-radius:3px;margin-bottom:3px
  }
  .pred-labels{display:flex;justify-content:space-between;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.2px;margin-bottom:2px}
  .pred-labels .pl-h{color:var(--blue)}
  .pred-labels .pl-d{color:var(--purple)}
  .pred-labels .pl-a{color:var(--red)}
  .pred-bar{height:4px;border-radius:10px;background:var(--bg);display:flex;overflow:hidden}
  .pred-bar .s-h{background:var(--blue);transition:width 1.1s cubic-bezier(.4,0,.2,1)}
  .pred-bar .s-d{background:var(--purple);transition:width 1.1s cubic-bezier(.4,0,.2,1)}
  .pred-bar .s-a{background:var(--red);transition:width 1.1s cubic-bezier(.4,0,.2,1)}
  .pred-probs{display:flex;justify-content:space-between;font-size:10px;font-weight:700;margin-top:2px}
  .pred-probs .pp-h{color:var(--blue)}
  .pred-probs .pp-d{color:var(--purple)}
  .pred-probs .pp-a{color:var(--red)}
  .pred-hint{font-size:9px;color:var(--text-muted);text-align:center;margin-top:3px}

  .groups-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
  .group-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
  .group-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .st{width:100%;border-collapse:collapse;font-size:11px}
  .st th{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);padding:4px 2px;text-align:left;border-bottom:1px solid var(--border)}
  .st th:last-child{text-align:center}
  .st td{padding:5px 2px;border-bottom:1px solid rgba(255,255,255,.015);color:var(--text-sec)}
  .st .pos{width:18px;font-weight:600;color:var(--text-muted);font-size:10px}
  .st .tc{display:flex;align-items:center;gap:5px}
  .st .tf{font-size:14px}
  .st .tn{font-weight:500}
  .st .stat{text-align:center;font-size:10px}
  .st .pts{font-weight:700;color:var(--text)}
  .st tr.top-two td .tn{color:var(--text)}
  .st tr.top-two td .pts{color:var(--green)}

  .loading-skel{padding:60px 20px;text-align:center}
  .skel-spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-muted)}
  .empty-state .e-icon{font-size:38px;margin-bottom:8px}

  footer{text-align:center;padding:32px 0;color:var(--text-muted);font-size:10px;border-top:1px solid var(--border);margin-top:36px}
  footer a{color:#60a5fa;text-decoration:none}

  @media(max-width:640px){
    .container{padding:0 12px}
    .matches-grid{grid-template-columns:1fr}
    .groups-grid{grid-template-columns:1fr}
    .logo-icon{width:34px;height:34px;font-size:18px}
    .logo-text h1{font-size:15px}
    .logo-text span{font-size:9px}
    .tab-btn{padding:5px 10px;font-size:11px}
    .team-flag{font-size:26px}
    .score{font-size:22px}
    .header-right{gap:8px}
    .live-badge{font-size:10px;padding:4px 10px}
  }
</style>
</head>
<body>

<div class="bg-glow"></div>

<header>
  <div class="container header-inner">
    <a href="/" class="logo">
      <div class="logo-icon">⚽</div>
      <div class="logo-text">
        <h1>World Cup 2026</h1>
        <span>AI win predictor</span>
      </div>
    </a>
    <div class="header-right">
      <div class="live-badge" id="liveBadge" style="display:none">LIVE</div>
      <div class="updated" id="lastUpd">—</div>
    </div>
  </div>
</header>

<main class="container">
  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-t="all">📊&nbsp;All</button>
    <button class="tab-btn" data-t="live">🔴&nbsp;Live&nbsp;<span class="tab-count" id="cLive">0</span></button>
    <button class="tab-btn" data-t="upcoming">📅&nbsp;Upcoming&nbsp;<span class="tab-count" id="cUp">0</span></button>
    <button class="tab-btn" data-t="finished">✅&nbsp;Finished&nbsp;<span class="tab-count" id="cFin">0</span></button>
    <button class="tab-btn" data-t="standings">🏆&nbsp;Standings</button>
  </div>
  <div id="content">
    <div class="loading-skel"><div class="skel-spin"></div><p style="font-size:13px;color:var(--text-muted)">Loading...</p></div>
  </div>
</main>

<footer>
  <div class="container">
    <p>Data: <a href="https://wheniskickoff.com" target="_blank">wheniskickoff.com</a> &nbsp;·&nbsp; FIFA World Cup 2026 🇺🇸🇲🇽🇨🇦</p>
  </div>
</footer>

<script>
const API = 'https://wheniskickoff.com/data/v1';
const REFRESH = 30000;
let mm=[],tt=[],gg=[],tab='all';

function dt(m){return new Date((m.datetime_utc.endsWith('Z')?m.datetime_utc:m.datetime_utc+'Z'))}
function cls(m){
  if(m.status==='FINISHED') return 'f';
  const d=dt(m),n=new Date(),h=(n-d)/36e5;
  if((m.status==='?'||!m.status)&&h<3&&h>-.5) return 'l';
  return d<n?'f':'u';
}

async function load(){
  const[a,b,c]=await Promise.all([
    fetch(API+'/matches.json'),
    fetch(API+'/teams.json'),
    fetch(API+'/groups.json')
  ]);
  mm=(await a.json()).data||[];
  tt=(await b.json()).data||[];
  gg=(await c.json()).data||[];
}

function pred(h,a,ph){
  const ht=tt.find(x=>x.code===h),at=tt.find(x=>x.code===a);
  const rH=ht?.rank??50,rA=at?.rank??50;
  let eH=1/(1+Math.pow(10,(rA-rH)/400)),eA=1-eH;
  if(ph!=='group'){if(rH<rA)eH+=.06;else eA+=.06}
  const fH=fm(h,3),fA=fm(a,3);
  eH+=(fH-fA)*.04;eA-=(fH-fA)*.04;
  const dr=Math.max(.08,Math.min(.3,.22-Math.abs(eH-eA)*.3)),tot=eH+eA;
  return{h:Math.round((eH/tot)*(1-dr)*100),d:Math.round(dr*100),a:Math.round((eA/tot)*(1-dr)*100),
    w:eH>eA?'h':eA>eH?'a':'d'};
}
function fm(c,n){
  const p=mm.filter(m=>(m.home===c||m.away===c)&&m.status==='FINISHED'&&m.score_home!=null).slice(-n);
  if(!p.length)return.5;
  let pt=0;
  for(const m of p){const g=m.home===c?m.score_home-m.score_away:m.score_away-m.score_home;if(g>0)pt+=1;else if(g===0)pt+=.5}
  return pt/p.length;
}

function st(){
  const s={};
  for(const g of gg){s[g.group]={};for(const c of g.teams){if(c==='URY')continue;s[g.group][c]={c,p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0}}}
  for(const m of mm){
    if(m.status!=='FINISHED'||m.score_home==null||m.phase!=='group') continue;
    if(!s[m.group]||!s[m.group][m.home]||!s[m.group][m.away]) continue;
    const h=s[m.group][m.home],a=s[m.group][m.away];
    h.p++;a.p++;h.gf+=m.score_home;h.ga+=m.score_away;a.gf+=m.score_away;a.ga+=m.score_home;
    if(m.score_home>m.score_away){h.w++;a.l++;h.pts+=3}else if(m.score_home<m.score_away){a.w++;h.l++;a.pts+=3}else{h.d++;a.d++;h.pts++;a.pts++}
    h.gd=h.gf-h.ga;a.gd=a.gf-a.ga;
  }
  for(const g in s)s[g]=Object.values(s[g]).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.c.localeCompare(b.c));
  return s;
}

function card(m){
  const c=m._c||cls(m),l=c==='l',f=c==='f',u=!l&&!f;
  const ht=tt.find(x=>x.code===m.home),at=tt.find(x=>x.code===m.away);
  const sc=f?`<span class="score-home">${m.score_home}</span><span class="score-colon">:</span><span class="score-away">${m.score_away}</span>`
    :l?`<span class="score-home">${m.score_home??'?'}</span><span class="score-colon">:</span><span class="score-away">${m.score_away??'?'}</span>`
    :`<span class="score-vs">vs</span>`;
  const sc2=f?'FT':l?'LIVE':'UPCOMING',sc3=f?'finished':l?'live':'upcoming';
  const p=pred(m.home,m.away,m.phase);
  const wn=p.w==='h'?m.home_name:p.w==='a'?m.away_name:'Draw';

  let t;
  if(f){const d=dt(m);t=d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}
  else if(u){const d=dt(m),n=new Date(),df=d-n;
    t=df>0&&df<864e5?`${Math.floor(df/36e5)}h ${Math.floor((df%36e5)/6e4)}m`
      :d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}
  else t=dt(m).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});

  return `<div class="match-card${l?' live':''}">
    <div class="match-header">
      <span class="match-group">${m.phase==='group'?'Group '+m.group:m.phase.replace(/_/g,' ')}</span>
      <span class="match-status ${sc3}">${sc2}</span>
    </div>
    <div class="match-teams">
      <div class="team home">
        <span class="team-flag">${ht?.flag??'🏳️'}</span>
        <span class="team-name">${m.home_name}</span>
        <span class="team-rank">FIFA #${ht?.rank??'—'}</span>
      </div>
      <div class="score">${sc}</div>
      <div class="team away">
        <span class="team-flag">${at?.flag??'🏳️'}</span>
        <span class="team-name">${m.away_name}</span>
        <span class="team-rank">FIFA #${at?.rank??'—'}</span>
      </div>
    </div>
    <div class="match-info">
      <span>${u?'⏳':''} ${t}</span>
      <span>${m.venue_name??''}</span>
    </div>
    <div>
      <div class="ai-badge">🤖 AI Predict</div>
      <div class="pred-labels">
        <span class="pl-h">${m.home_name}</span>
        <span class="pl-d">Draw</span>
        <span class="pl-a">${m.away_name}</span>
      </div>
      <div class="pred-bar">
        <div class="s-h" style="width:${p.h}%"></div>
        <div class="s-d" style="width:${p.d}%"></div>
        <div class="s-a" style="width:${p.a}%"></div>
      </div>
      <div class="pred-probs">
        <span class="pp-h">${p.h}%</span>
        <span class="pp-d">${p.d}%</span>
        <span class="pp-a">${p.a}%</span>
      </div>
      <div class="pred-hint">AI predicts <strong>${wn}</strong> wins</div>
    </div>
  </div>`;
}

function renderTab(ca){
  const all=mm.map(m=>({...m,_c:cls(m)}));
  let li;
  if(ca==='l')li=all.filter(m=>m._c==='l');
  else if(ca==='u')li=all.filter(m=>m._c==='u');
  else if(ca==='f')li=all.filter(m=>m._c==='f');
  else li=all;
  if(ca==='l'&&!li.length)li=all.filter(m=>m._c==='u').slice(0,6);
  return li.map(card).join('');
}

function renderSt(){
  const sg=st();
  return gg.map(g=>{
    const r=sg[g.group];
    if(!r||!r.length)return'';
    return `<div class="group-card">
      <div class="group-title">🏆 Group ${g.group}</div>
      <table class="st">
        <thead><tr>
          <th></th><th>Team</th><th class="stat">P</th><th class="stat">W</th><th class="stat">D</th><th class="stat">L</th><th class="stat">GD</th><th class="stat">Pts</th>
        </tr></thead>
        <tbody>${r.map((t,i)=>{const tm=tt.find(x=>x.code===t.c);
          return `<tr class="${i<2?'top-two':''}">
            <td class="pos">${i+1}</td>
            <td><div class="tc"><span class="tf">${tm?.flag??'🏳️'}</span><span class="tn">${tm?.name??t.c}</span></div></td>
            <td class="stat">${t.p}</td><td class="stat">${t.w}</td><td class="stat">${t.d}</td><td class="stat">${t.l}</td>
            <td class="stat">${t.gd>0?'+':''}${t.gd}</td><td class="stat pts">${t.pts}</td>
          </tr>`}).join('')}</tbody>
      </table>
    </div>`}).join('');
}

function ref(){
  const all=mm.map(m=>({...m,_c:cls(m)}));
  const nL=all.filter(m=>m._c==='l').length;
  document.getElementById('cLive').textContent=nL;
  document.getElementById('cUp').textContent=all.filter(m=>m._c==='u').length;
  document.getElementById('cFin').textContent=all.filter(m=>m._c==='f').length;
  const lb=document.getElementById('liveBadge');
  if(nL)lb.style.display='flex';else lb.style.display='none';
  document.getElementById('lastUpd').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  const ct=document.getElementById('content');
  if(tab==='standings'){
    ct.innerHTML='<div class="section-title">🏆 Group Standings</div><div class="groups-grid">'+renderSt()+'</div>';
    return;
  }
  if(tab==='all'){
    const a=all.filter(m=>m._c==='l'),b=all.filter(m=>m._c==='u'),c=all.filter(m=>m._c==='f');
    ct.innerHTML=(a.length?'<div class="section-title">🔴 Live Now</div><div class="matches-grid">'+a.map(card).join('')+'</div>':'')
      +'<div class="section-title">📅 Upcoming</div><div class="matches-grid">'+b.map(card).join('')+'</div>'
      +'<div class="section-title">✅ Recent Results</div><div class="matches-grid">'+c.slice(0,12).map(card).join('')+'</div>';
    return;
  }
  const h=renderTab(tab);
  if(!h){ct.innerHTML='<div class="empty-state"><div class="e-icon">⚽</div><p>'+
    (tab==='l'?'No live matches right now.':tab==='u'?'No upcoming matches.':'No finished matches yet.')+'</p></div>';return}
  ct.innerHTML='<div class="matches-grid">'+h+'</div>';
}

async function boot(){
  try{await load();ref()}
  catch(e){document.getElementById('content').innerHTML='<div class="empty-state"><div class="e-icon">⚠️</div><p>Could not load match data.</p><p style="font-size:11px;color:var(--text-muted);margin-top:4px;">'+e.message+'</p></div>'}
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.tab-btn');if(!b)return;
  tab=b.dataset.t;document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');ref()
});

boot();setInterval(boot,REFRESH);
</script>
</body>
</html>
